# Read by the shared `screenshots` runner in Repos/Scripts. Everything not set here takes that
# script's defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Palette 3D.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.palette3d"
MAC_APP_NAME="Palette Studio"
PLATFORMS="iphone ipad mac vision"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix.
SHOT_DESCRIPTIONS="
  library       = The Palettes library, the seeded palettes each showing their colors
  editor-sphere = The Sunset Study palette open in the editor, its colors placed on the 3D color solid
  editor-grid   = The same palette in the editor's Grid display mode, colors laid out as swatches
  pairs         = The Pairs tab: two colors mixed with color-mix(), their gradient through every CSS
                  interpolation space, and the perceptual difference between them
  color         = The Color tab, one scratch color broken down into its components and conversions
"
